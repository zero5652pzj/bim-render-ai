<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 天气查询测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .test-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .test-section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .city-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .city-input:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.3);
        }

        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #e9ecef;
        }

        .weather-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .weather-item {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .weather-item h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .weather-item .temp {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .weather-item .desc {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .error {
            background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .quick-tests {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .quick-btn {
            padding: 8px 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .quick-btn:hover {
            background: #5a6268;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status.online {
            background: #d4edda;
            color: #155724;
        }

        .status.offline {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ MCP 天气查询测试</h1>
            <p>测试 Model Context Protocol 天气工具功能</p>
        </div>

        <div class="test-section">
            <h2>🔌 服务器状态</h2>
            <div id="server-status" class="status offline">检查中...</div>
            <div id="server-info"></div>
        </div>

        <div class="test-section">
            <h2>🛠️ 可用工具</h2>
            <div id="tools-list">加载中...</div>
        </div>

        <div class="test-section">
            <h2>🌍 天气查询测试</h2>

            <div class="input-group">
                <input
                    type="text"
                    id="city-input"
                    class="city-input"
                    placeholder="输入城市名称 (如: Beijing, 上海)"
                    value="Beijing"
                />
                <button id="query-btn" class="btn">查询天气</button>
            </div>

            <div class="quick-tests">
                <button class="quick-btn" onclick="quickQuery('Beijing')">北京</button>
                <button class="quick-btn" onclick="quickQuery('Shanghai')">上海</button>
                <button class="quick-btn" onclick="quickQuery('Guangzhou')">广州</button>
                <button class="quick-btn" onclick="quickQuery('Shenzhen')">深圳</button>
                <button class="quick-btn" onclick="quickQuery('Hangzhou')">杭州</button>
                <button class="quick-btn" onclick="quickQuery('Chengdu')">成都</button>
            </div>

            <div id="weather-result"></div>
        </div>

        <div class="test-section">
            <h2>💬 AI 聊天测试</h2>
            <p>在 MCP 测试页面中尝试输入："北京天气怎么样？"</p>
            <a href="/mcp-test" target="_blank" class="btn" style="display: inline-block; text-decoration: none;">
                打开 MCP 测试页面
            </a>
        </div>
    </div>

    <script>
        // 全局变量
        let isLoading = false;

        // DOM 元素
        const serverStatus = document.getElementById('server-status');
        const serverInfo = document.getElementById('server-info');
        const toolsList = document.getElementById('tools-list');
        const cityInput = document.getElementById('city-input');
        const queryBtn = document.getElementById('query-btn');
        const weatherResult = document.getElementById('weather-result');

        // 检查 MCP 服务器状态
        async function checkServerStatus() {
            try {
                const response = await fetch('/api/mcp');
                const data = await response.json();

                if (data.name === 'bim-ai-tools') {
                    serverStatus.textContent = '✅ MCP 服务器在线';
                    serverStatus.className = 'status online';
                    serverInfo.innerHTML = `
                        <p><strong>名称:</strong> ${data.name}</p>
                        <p><strong>版本:</strong> ${data.version}</p>
                        <p><strong>协议版本:</strong> ${data.protocolVersion}</p>
                    `;
                    return true;
                } else {
                    throw new Error('服务器响应异常');
                }
            } catch (error) {
                serverStatus.textContent = '❌ MCP 服务器离线';
                serverStatus.className = 'status offline';
                serverInfo.innerHTML = `<p>错误: ${error.message}</p>`;
                return false;
            }
        }

        // 获取工具列表
        async function fetchToolsList() {
            try {
                const response = await fetch('/api/mcp/tools/list', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'tools/list'
                    })
                });

                const data = await response.json();
                const tools = data.result?.tools || data.tools || [];

                if (tools.length > 0) {
                    toolsList.innerHTML = `
                        <p>发现 ${tools.length} 个工具:</p>
                        <ul>
                            ${tools.map(tool => `
                                <li><strong>${tool.name}</strong>: ${tool.description}</li>
                            `).join('')}
                        </ul>
                    `;
                } else {
                    toolsList.innerHTML = '<p>未发现工具</p>';
                }
            } catch (error) {
                toolsList.innerHTML = `<p>获取工具列表失败: ${error.message}</p>`;
            }
        }

        // 查询天气
        async function queryWeather(city) {
            if (isLoading) return;

            isLoading = true;
            queryBtn.disabled = true;
            queryBtn.textContent = '查询中...';
            weatherResult.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在获取天气信息...</p></div>';

            try {
                const response = await fetch('/api/mcp/tools/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: Date.now(),
                        method: 'tools/call',
                        params: {
                            name: 'getWeather',
                            arguments: {
                                location: city
                            }
                        }
                    })
                });

                const data = await response.json();
                const result = data.result || data;

                if (result.structuredContent) {
                    const weather = result.structuredContent;
                    displayWeather(weather);
                } else {
                    throw new Error('天气数据格式异常');
                }
            } catch (error) {
                weatherResult.innerHTML = `<div class="error">❌ 天气查询失败: ${error.message}</div>`;
            } finally {
                isLoading = false;
                queryBtn.disabled = false;
                queryBtn.textContent = '查询天气';
            }
        }

        // 显示天气结果
        function displayWeather(weather) {
            weatherResult.innerHTML = `
                <div class="result">
                    <h3>🌤️ ${weather.location} 天气信息</h3>
                    <div class="weather-card">
                        <div class="weather-item">
                            <h3>🌡️ 温度</h3>
                            <div class="temp">${weather.temperature}°C</div>
                            <div class="desc">${weather.description}</div>
                        </div>
                        <div class="weather-item">
                            <h3>💧 湿度</h3>
                            <div class="temp">${weather.humidity}%</div>
                            <div class="desc">相对湿度</div>
                        </div>
                        <div class="weather-item">
                            <h3>💨 风速</h3>
                            <div class="temp">${weather.windSpeed}</div>
                            <div class="desc">km/h</div>
                        </div>
                        <div class="weather-item">
                            <h3>📊 气压</h3>
                            <div class="temp">${weather.pressure}</div>
                            <div class="desc">hPa</div>
                        </div>
                    </div>
                    <p style="margin-top: 15px; text-align: center; color: #6c757d;">
                        🕒 更新时间: ${weather.timestamp}
                    </p>
                </div>
            `;
        }

        // 快速查询
        function quickQuery(city) {
            cityInput.value = city;
            queryWeather(city);
        }

        // 事件监听
        document.getElementById('query-btn').addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) {
                queryWeather(city);
            } else {
                alert('请输入城市名称');
            }
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = cityInput.value.trim();
                if (city) {
                    queryWeather(city);
                }
            }
        });

        // 页面加载时初始化
        window.addEventListener('load', async () => {
            await checkServerStatus();
            await fetchToolsList();
        });
    </script>
</body>
</html>
